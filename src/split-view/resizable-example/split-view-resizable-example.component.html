<c8y-title>{{ 'Alarms' | translate }}</c8y-title>

<!-- important -->
<c8y-sv [resizableConfig]="{ trackId: 'codex-alarms-split-view', collapsible: false }">
  <c8y-sv-list
    [emptyStateIcon]="'c8y-alert-idle'"
    [title]="'Alarms list' | translate"
    [emptyStateTitle]="'No alarms to display.' | translate"
    [loading]="loading()"
    [showEmptyState]="alarms().length === 0"
    [docsUrl]="'/docs/device-management-application/monitoring-and-controlling-devices/#working-with-alarms'"
  >
    <c8y-sv-header-actions>
      <button
        class="btn btn-default btn-sm"
        [attr.aria-label]="'Refresh' | translate"
        type="button"
        [disabled]="loading()"
        (click)="refresh()"
      >
        <i [class.icon-spin]="loading()" c8yIcon="refresh"></i>
      </button>
    </c8y-sv-header-actions>
    <!-- /important -->

    <c8y-list-group class="c8y-list--timeline d-block p-r-16 p-t-16">
      @for (alarm of alarms(); track alarm.id) {
        <!-- important -->
        <c8y-li-timeline
          class="pointer c8y-list--timeline__item"
          role="button"
          [routerLink]="[alarm.id]"
          routerLinkActive="active"
        >
          <!-- /important -->
          <span>
            {{ alarm.time | c8yDate: 'mediumDate' }}
            {{ alarm.time | c8yDate: 'mediumTime' }}
          </span>
          <c8y-li>
            <c8y-li-icon class="a-s-start">
              <div class="alarm-icons">
                <c8y-alarms-icon [alarm]="alarm" [typeFilters]="[]"></c8y-alarms-icon>
              </div>
              @if (alarm.count > 1) {
                <span class="badge badge-info">{{ alarm.count }}</span>
              }
            </c8y-li-icon>
            <c8y-li-body class="a-s-stretch">
              <p class="text-truncate-wrap p-b-4">{{ alarm.text }}</p>
              <p class="small text-muted text-truncate" [title]="alarm.source.name">
                <i c8yIcon="exchange"></i>
                {{ alarm.source.name }}
              </p>
            </c8y-li-body>
          </c8y-li>
        </c8y-li-timeline>
      }
    </c8y-list-group>
  </c8y-sv-list>

  <!-- important -->
  <c8y-sv-details
    emptyStateIcon="alarm"
    [emptyStateTitle]="'No alarm selected' | translate"
    [emptyStateSubtitle]="'Select an alarm from the list to view its details.' | translate"
    (backClick)="closeDetails()"
  >
    <router-outlet></router-outlet>
  </c8y-sv-details>
</c8y-sv>
<!-- /important -->
