<c8y-title>{{ 'Audit logs' | translate }}</c8y-title>

<!-- important -->
<c8y-sv>
  <c8y-sv-list
    [emptyStateIcon]="'audit'"
    [title]="'Audit logs' | translate"
    [emptyStateTitle]="'No audit logs to display.' | translate"
    [showEmptyState]="records.length === 0"
  >
    <!-- /important -->
    <c8y-list-group class="c8y-list--timeline d-block p-r-16 p-t-16">
      @for (record of records; track record.id) {
        <c8y-li-timeline class="c8y-list--timeline__item">
          <span>
            {{ record.time | c8yDate: 'mediumDate' }}
            {{ record.time | c8yDate: 'mediumTime' }}
          </span>
          <c8y-li>
            <c8y-li-icon>
              <i c8yIcon="audit"></i>
            </c8y-li-icon>
            <c8y-li-body>
              <p class="text-truncate-wrap">{{ record.activity }}: {{ record.text }}</p>
              <p class="small text-muted text-truncate">
                <i c8yIcon="user"></i>
                {{ record.user }} · {{ record.type }}
              </p>
            </c8y-li-body>
          </c8y-li>
        </c8y-li-timeline>
      }
    </c8y-list-group>
    <!-- important -->
  </c8y-sv-list>
</c8y-sv>
<!-- /important -->
