@let current = service.status$ | async;
<c8y-title>Status bar run state</c8y-title>
<div class="card">
  <div class="card-block">
    <p class="m-b-16">
      Switch the asset state to see the status bar above change its theme and state.
    </p>
    <div class="btn-group" aria-label="Asset state" role="group">
      @for (status of statuses; track status) {
        <button
          class="btn btn-default btn-sm"
          [class.active]="current === status"
          [attr.aria-pressed]="current === status"
          type="button"
          (click)="service.setStatus(status)"
        >
          {{ labels[status] }}
        </button>
      }
    </div>
  </div>
</div>
