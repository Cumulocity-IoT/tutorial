<c8y-title>Custom dashboard</c8y-title>

<!--
  Anatomy of a dashboard:
  - <c8y-dashboard> renders the GridStack grid (default layout="grid", 12 columns).
  - Each <c8y-dashboard-child> is a widget positioned and sized with x / y / width / height.
  - <c8y-dashboard-child-title> sets the widget header; the widget body is any content you project.
-->
<c8y-dashboard [columns]="12">
  <c8y-dashboard-child [editMode]="false" [x]="0" [y]="0" [width]="6" [height]="2">
    <c8y-dashboard-child-title>
      <span>First widget</span>
    </c8y-dashboard-child-title>
    <div class="card-block">Positioned at column 0, spanning 6 of the 12 columns.</div>
  </c8y-dashboard-child>

  <c8y-dashboard-child [editMode]="false" [x]="6" [y]="0" [width]="6" [height]="2">
    <c8y-dashboard-child-title>
      <span>Second widget</span>
    </c8y-dashboard-child-title>
    <div class="card-block">Positioned at column 6, spanning the remaining 6 columns.</div>
  </c8y-dashboard-child>

  <c8y-dashboard-child [editMode]="false" [x]="0" [y]="2" [width]="12" [height]="2">
    <c8y-dashboard-child-title>
      <span>Full-width widget</span>
    </c8y-dashboard-child-title>
    <div class="card-block">Placed on the next row, spanning all 12 columns.</div>
  </c8y-dashboard-child>
</c8y-dashboard>
