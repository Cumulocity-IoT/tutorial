<c8y-title>Minimum widget size</c8y-title>

<c8y-action-bar-item [placement]="'right'">
  <button
    class="btn btn-link"
    title="{{ editMode ? 'Disable edit mode' : 'Enable edit mode' }}"
    type="button"
    (click)="toggleEdit()"
  >
    <i [c8yIcon]="editMode ? 'lock' : 'unlock'"></i>
    {{ editMode ? 'Disable edit mode' : 'Enable edit mode' }}
  </button>
</c8y-action-bar-item>

<!--
  [minW]="3" [minH]="2" — enable edit mode and drag the widget's resize handle.
  GridStack stops the widget from shrinking below 3 columns wide or 2 rows tall.
-->
<c8y-dashboard [columns]="12">
  <c8y-dashboard-child
    [editMode]="editMode"
    [x]="0"
    [y]="0"
    [width]="4"
    [height]="3"
    [minW]="3"
    [minH]="2"
  >
    <c8y-dashboard-child-title>
      <span>Resizable, minimum 3 &times; 2</span>
    </c8y-dashboard-child-title>
    <div class="card-block">
      Enable edit mode and resize this widget — it will not shrink below 3 columns wide or 2 rows
      tall.
    </div>
  </c8y-dashboard-child>
</c8y-dashboard>
